# Автоматическая проверка кода в GitHub Actions (на серверах GitHub, не на вашем сервере).
# Запускается на каждый pull request и push в main: ruff + юнит-тесты, миграции и тесты
# на временной PostgreSQL, сборка Docker-образов. Ничего не выкатывает.
# Подробная инструкция: .github/CI.md
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    name: Lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bot/requirements.txt
            bot/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  migrations:
    name: Migrations & DB integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: honey
          POSTGRES_PASSWORD: "pa%ss@word"
          POSTGRES_DB: honey
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U honey -d honey"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_USER: honey
      POSTGRES_PASSWORD: "pa%ss@word"
      POSTGRES_DB: honey
      DB_HOST: localhost
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bot/requirements.txt
            bot/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Upgrade from scratch
        run: alembic upgrade head
      - name: Last migration is reversible
        run: alembic downgrade -1 && alembic upgrade head
      - name: Service tests on real PostgreSQL
        run: pytest -q tests/integration
        env:
          RUN_DB_TESTS: "1"

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t honey-bot ./bot
      - run: docker build -t honey-db ./db
      - run: docker build -t honey-log-viewer ./log_viewer
