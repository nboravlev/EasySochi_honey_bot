# Боевой контур honeybot. Собирать и запускать — скриптом ops/deploy.sh (сборка, теги образов,
# бэкап, миграции, ожидание готовности). Тестовый контур — deploy/test/ (README там же).
#
# Имя проекта зафиксировано: compose выводит его из имени каталога, и в другом каталоге
# (или при запуске из ops/) тома и сеть получили бы другой префикс — то есть пустые новые.
# Значение совпадает с тем, что было до фиксации (каталог EasySochi_honey_bot).
name: easysochi_honey_bot

# Лимит логов Docker (docker logs): без него json-file растёт бесконечно
x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db_honey:
    # Образы называются явно и получают тег сборки (ops/deploy.sh: короткий хеш коммита).
    # Откат на прошлую сборку: TAG=<тег> docker compose up -d (см. OPERATIONS.md, раздел 1).
    image: honeybot/db:${TAG:-latest}
    build: ./db
    container_name: postgres_db_honey
    restart: always
    env_file: .env
    # По умолчанию БД доступна только с самого сервера (SSH-туннель для DBeaver/serial_actualization).
    # Открыть наружу: POSTGRES_BIND=0.0.0.0 в .env — осознанно и с firewall.
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT}:5432"
    volumes:
      - honey_bot_postgres_data:/var/lib/postgresql/data
    networks:
      - tg_app_net_honey
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # Миграции базы — при каждом запуске стека, до бота и API (они ждут её успешного завершения).
  # Один запуск на всех: бот и API не накатывают миграции наперегонки. Упала миграция —
  # бот и API не стартуют на несовместимой схеме, а docker compose up завершается ошибкой.
  migrate_honey:
    image: honeybot/bot:${TAG:-latest}
    # образ собирает сервис bot_honey; тянуть его из Docker Hub нечего
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    user: "1000:1000"
    container_name: migrate_honey
    restart: "no"
    env_file: .env
    depends_on:
      db_honey:
        condition: service_healthy
    networks:
      - tg_app_net_honey
    logging: *logging

  bot_honey:
    image: honeybot/bot:${TAG:-latest}
    build: ./bot
    user: "1000:1000"
    container_name: tg_bot_honey
    restart: unless-stopped
    env_file: .env
    # код берётся из образа, а не с хоста
    volumes:
      - bot_logs_honey:/app/logs
      - bot_media_honey:/app/media
      # состояние диалогов (PicklePersistence); именованный том Docker — подготовка хоста не нужна
      - bot_state_honey:/app/state
    depends_on:
      db_honey:
        condition: service_healthy
      migrate_honey:
        condition: service_completed_successfully
    networks:
      - tg_app_net_honey
    # бот каждые 30 с обновляет /tmp/bot_heartbeat; старше 3 минут — процесс завис.
    # Сам Docker не перезапускает unhealthy-контейнер: это делает ops/restart-if-unhealthy.sh по cron.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/bot_heartbeat')<180 else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging: *logging

  # HTTP API витрины и админки: тот же образ, что у бота, команда api (uvicorn).
  # Наружу не публикуется — к нему ходит только web_honey по сети Docker.
  api_honey:
    image: honeybot/bot:${TAG:-latest}
    pull_policy: never
    command: ["api"]
    user: "1000:1000"
    container_name: api_honey
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot_logs_honey:/app/logs
      # фото товаров: API отдаёт их витрине и сохраняет загруженные из админки
      - bot_media_honey:/app/media
    depends_on:
      db_honey:
        condition: service_healthy
      migrate_honey:
        condition: service_completed_successfully
    networks:
      - tg_app_net_honey
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging: *logging

  # Витрина и админка: собранный фронтенд (web/) + прокси /api и /media в api_honey.
  # Внешний nginx-шлюз с HTTPS проксирует домен витрины сюда (см. OPERATIONS.md, раздел 11).
  web_honey:
    image: honeybot/web:${TAG:-latest}
    build: ./web
    container_name: web_honey
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8090}:80"
    depends_on:
      - api_honey
    networks:
      - tg_app_net_honey
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging: *logging

  log-viewer_honey:
    image: honeybot/log-viewer:${TAG:-latest}
    build: ./log_viewer
    user: "1000:1000"
    container_name: log_viewer_honey
    restart: unless-stopped
    env_file: .env
    # Вьюер без авторизации, а в логах есть персональные данные: по умолчанию только localhost
    # (доступ через SSH-туннель или шлюз с basic-auth). LOG_VIEWER_BIND=0.0.0.0 — открыть наружу.
    ports:
      - "${LOG_VIEWER_BIND:-127.0.0.1}:${LOG_VIEWER_PORT}:${LOG_VIEWER_PORT}"
    environment:
      # Явно передаем порт внутрь, чтобы python-скрипт его видел
      - LOG_VIEWER_PORT=${LOG_VIEWER_PORT}
    volumes:
      - bot_logs_honey:/app/logs:ro
    depends_on:
      - bot_honey
    networks:
      - tg_app_net_honey
    logging: *logging

volumes:
  honey_bot_postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/easysochi/postgres_honey
  bot_media_honey:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/easysochi/media_honey
  bot_logs_honey:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/easysochi/logs_honey
  bot_state_honey:
    driver: local

networks:
  tg_app_net_honey:
    driver: bridge
