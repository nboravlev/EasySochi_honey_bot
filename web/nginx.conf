# Контейнер web_honey. Снаружи перед ним — внешний nginx-шлюз с HTTPS (honey.easy-sochi.ru),
# Telegram открывает Mini App только по https.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 16k;

    # имя api_honey резолвится при запросе (DNS Docker), а не при старте:
    # nginx поднимается, даже если API ещё перезапускается
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api http://api_honey:8000;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # админка: загрузка фото товаров (до 15 МБ)
    location /api/admin/ {
        client_max_body_size 16m;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # фото товаров: файлы с уникальными именами не меняются — кэшируются надолго
    location /media/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # файлы сборки с хешем в имени
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # админка — своя страница; поисковикам не показываем
    location /admin/ {
        try_files $uri /admin/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy no-referrer always;
    }

    # приложение: index.html не кэшируем, чтобы новая версия приходила сразу
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
